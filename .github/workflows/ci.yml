name: IntelliCredit CI - Quality & Risk Analytics Suite

on:
  push:
    branches:
      - main
      - feat/*
      - chore/*
  pull_request:
    branches:
      - main

jobs:
  test-and-audit:
    name: Run Integrity Audit & Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data Integrity & Schema Audit
        run: |
          python -m src.data_integrity

      - name: Execute Unit Test Suite
        run: |
          python -m unittest discover tests

      - name: Test Portfolio Risk Report Generation
        run: |
          python -m scripts.generate_portfolio_risk_report

